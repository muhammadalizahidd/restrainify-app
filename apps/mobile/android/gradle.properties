android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Overrides the `minSdk` entry of the expoLibs version catalog, which Expo derives
# from node_modules/react-native/gradle/libs.versions.toml (RN 0.86.3 defaults to 24).
# Every other Android/Kotlin version comes from that catalog unmodified.
android.minSdkVersion=26
